version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cozyhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cozyhub
      POSTGRES_USER: cozyhub
      POSTGRES_PASSWORD: cozyhub_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cozyhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cozyhub_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://cozyhub:cozyhub_secret@postgres:5432/cozyhub?sslmode=disable
      JWT_SECRET: dev-jwt-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend:/app
    working_dir: /app

volumes:
  postgres_data:
    driver: local
